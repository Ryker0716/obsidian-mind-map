name: Release Build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build
        id: build
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          echo "tag_name=$(git tag --points-at HEAD --sort=-version:refname | head -n 1)" >> "$GITHUB_OUTPUT"
          if [ -z "${{ steps.build.outputs.tag_name }}" ]; then
            echo "Push a version tag to publish a release (workflow_dispatch on a branch only builds). "
            exit 1
          fi
          mkdir "${{ env.PLUGIN_NAME }}"
          cp dist/main.js manifest.json "${{ env.PLUGIN_NAME }}/"
          zip -r "${{ env.PLUGIN_NAME }}.zip" "${{ env.PLUGIN_NAME }}"
      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build.outputs.tag_name }}
          name: ${{ steps.build.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/main.js
            manifest.json
            ${{ env.PLUGIN_NAME }}.zip

env:
  PLUGIN_NAME: obsidian-mind-map
